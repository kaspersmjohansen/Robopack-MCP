[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "robopack-mcp"
version = "0.1.0"
description = "Unofficial MCP server for the Robopack v1 API (Intune app packaging)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kasper Johansen" }]
keywords = ["mcp", "model-context-protocol", "robopack", "intune", "app-packaging", "psadt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2",
    "httpx>=0.27",
    "pefile>=2023.2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/kaspersmjohansen/Robopack-MCP"
Repository = "https://github.com/kaspersmjohansen/Robopack-MCP"
Issues = "https://github.com/kaspersmjohansen/Robopack-MCP/issues"

[project.scripts]
robopack-mcp = "robopack_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/robopack_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
