[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robopack-mcp"
version = "0.1.0"
description = "MCP server for the Robopack v1 API (Intune app packaging)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
robopack-mcp = "robopack_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/robopack_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
